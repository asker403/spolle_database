name: Auto Update Spotify Artists Database

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday at midnight UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab in the UI

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Fetcher Script
      env:
        SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      run: python songle/enhanced_fetch_real_data.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node.js dependencies
      run: |
        cd songle
        npm install

    - name: Run Upload Script
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: |
        echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > songle/serviceAccountKey.json
        node songle/upload-artists.js
